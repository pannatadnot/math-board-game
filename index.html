<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คลังการ์ด · ตลาดนัดอัตราส่วน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFF6E5;color:#1F2A44;font-family:Sarabun,sans-serif}
h1,h2,.hd{font-family:Prompt,Sarabun,sans-serif}
header{position:sticky;top:0;z-index:5;background:#FFF6E5;border-bottom:2px solid #E8D9B8;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
nav a{text-decoration:none;color:#fff;border-radius:16px;padding:4px 14px;font-family:Prompt,Sarabun,sans-serif;font-size:15px;font-weight:600}
button.link{background:none;border:0;color:#4A5578;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
main{padding:8px 24px 48px;max-width:1500px;margin:0 auto}
section{margin-top:28px}
section h2{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:26px;font-weight:700}
section h2 small{font-family:Sarabun,sans-serif;font-size:16px;color:#4A5578;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.tile{position:relative;border:0;padding:6px;border-radius:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);outline:3px solid #1F2A44;outline-offset:2px}
.tile .in{background:#FFFCF5;border-radius:11px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.tile .art{height:92px;overflow:hidden}
.tile .art svg{display:block;width:100%;height:100%}
.tile .meta{padding:8px 10px 10px}
.tile .no{font-family:Prompt,Sarabun,sans-serif;font-weight:700;font-size:22px;line-height:1}
.tile .ti{font-size:16px;font-weight:600;line-height:1.3;margin-top:4px;min-height:42px}
.tile .co{margin-top:4px;font-size:14px;font-weight:700;color:#7A5A00}
.tile .seen{position:absolute;top:10px;right:10px;background:#1F9D68;color:#fff;width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.tile.done .seen{display:flex}
.tile.done .in{opacity:.7}
#ov{position:fixed;inset:0;background:rgba(20,26,46,.88);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#ov.on{display:flex}
.stage{display:flex;align-items:center;gap:clamp(8px,2vw,28px)}
.nb{width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:#1F2A44;font-size:30px;cursor:pointer;flex:none}
.nb:disabled{opacity:.3;cursor:default}
.flip{width:min(calc((100vh - 130px)*336/472),calc(100vw - 180px));aspect-ratio:336/472;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .22s ease-in}
.flip.turn .inner{transform:scaleX(0)}
.face{position:absolute;inset:0;container-type:inline-size}
.face.bk{display:none}
.flip.back .face.bk{display:block}
.flip.back #ff{display:none}
.card{width:100%;height:100%;border-radius:6.5cqw;padding:2.4cqw}
.card>.pp{width:100%;height:100%;border-radius:4.5cqw;background:#FFFCF5;padding:3.6cqw;display:flex;flex-direction:column;gap:2.7cqw;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;min-height:10.7cqw}
.top .l{display:flex;align-items:center;gap:2.4cqw}
.pill{color:#fff;border-radius:4.2cqw;padding:.6cqw 4.2cqw;font-family:Prompt,Sarabun,sans-serif;font-size:5cqw;font-weight:600;white-space:nowrap}
.pill.ink{background:#1F2A44}
.num{color:#4A5578;font-size:4.8cqw;font-weight:600}
.cn{display:flex;align-items:center;gap:1.2cqw;background:#FFF1BF;border:.6cqw solid #E0B02F;border-radius:4.8cqw;padding:.6cqw 3.6cqw .6cqw 1.8cqw;font-family:Prompt,Sarabun,sans-serif;font-size:6cqw;font-weight:700}
.coin{width:7.7cqw;height:7.7cqw;display:block}
.art2{flex:none;border-radius:3.6cqw;overflow:hidden;border-style:solid;border-width:.9cqw}
.art2 svg{display:block;width:100%;height:100%}
.ttl{font-family:Prompt,Sarabun,sans-serif;font-size:7.4cqw;font-weight:700;line-height:1.3}
.txt{font-size:6.25cqw;line-height:1.5;font-weight:500}
.sp{flex:1}
.foot{border-top:.6cqw dashed;padding-top:2.4cqw;color:#4A5578;font-size:4.5cqw;line-height:1.3;text-align:center}
.alabel{font-family:Prompt,Sarabun,sans-serif;font-size:4.8cqw;font-weight:700}
.abox{border-radius:4.2cqw;padding:1cqw 4.2cqw 2cqw;border-style:solid;border-width:.9cqw}
.abox .aval{font-family:Prompt,Sarabun,sans-serif;font-size:9.4cqw;font-weight:700;line-height:1.25}
.sh{font-family:Prompt,Sarabun,sans-serif;font-size:5cqw;font-weight:700;color:#4A5578;margin-bottom:2cqw}
.st{display:flex;gap:2.6cqw;align-items:flex-start;margin-bottom:1.4cqw}
.st i{font-style:normal;flex:none;width:6.6cqw;height:6.6cqw;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Prompt,Sarabun,sans-serif;font-size:4.5cqw;font-weight:700}
.st span{font-size:5.1cqw;line-height:1.3}
.gain{display:flex;align-items:center;justify-content:center;gap:3cqw;border-radius:4.8cqw;padding:1cqw 4.2cqw;font-family:Prompt,Sarabun,sans-serif;font-size:5.6cqw;font-weight:700}
#tm{display:flex;align-items:center;gap:12px;color:#fff}
#tt{font:700 34px Prompt,sans-serif;min-width:96px;text-align:center;background:rgba(255,255,255,.15);border-radius:12px;padding:0 12px;font-variant-numeric:tabular-nums}
#tm.run #tt{background:#1F9D68}#tm.warn #tt{background:#F28C1B}#tm.end #tt{background:#E5484D;animation:fl .5s steps(2) infinite}
@keyframes fl{50%{opacity:.35}}
.tb{border:0;border-radius:18px;padding:6px 18px;font:600 16px Prompt,Sarabun,sans-serif;background:#fff;color:#1F2A44;cursor:pointer}
.hint{color:#fff;font-size:15px;opacity:.85;text-align:center}
#x{position:absolute;top:14px;right:18px;background:#fff;border:0;border-radius:20px;padding:6px 18px;font:600 16px Prompt,Sarabun,sans-serif;cursor:pointer}
@media (max-width:640px){.nb{display:none}.flip{width:min(calc((100vh - 130px)*336/472),94vw)}}

[hidden]{display:none!important}
.tabs{display:flex;gap:6px}
.tab{border:2px solid #1F2A44;background:#fff;color:#1F2A44;border-radius:18px;padding:4px 16px;font:600 15px Prompt,Sarabun,sans-serif;cursor:pointer}
.tab.on{background:#1F2A44;color:#fff}
#bv{padding:8px 12px 24px}
.bd{container-type:inline-size;width:min(100%,calc((100vh - 76px)*2016/1414));aspect-ratio:2016/1414;margin:0 auto;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(7,1fr);gap:.5cqw}
.cl{position:relative;border:.25cqw solid;border-radius:1cqw;background:#fff;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
.cl.here{outline:.4cqw solid #1F2A44;outline-offset:-.1cqw;z-index:2}
.cl .bn{display:flex;align-items:center;gap:.5cqw;padding:.3cqw .5cqw;color:#fff;font-family:Prompt,Sarabun,sans-serif;font-weight:600;font-size:1.1cqw;line-height:1.2;white-space:nowrap;overflow:hidden}
.cl .bn b{flex:none;width:2cqw;height:2cqw;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2cqw}
.cl .ar{position:relative;flex:1;min-height:0}
.cl .ar svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gm{position:absolute;left:.3cqw;top:.3cqw;border-radius:1cqw;padding:0 .6cqw;font-family:Prompt,Sarabun,sans-serif;font-weight:700;font-size:1.05cqw;line-height:1.5;z-index:1}
.gm.p{background:#E1F5E9;color:#1F7A4D;border:.15cqw solid #1F9D68}
.gm.m{background:#FDE6E6;color:#C23B3B;border:.15cqw solid #C23B3B}
.gm.c{background:#FFF1BF;color:#7A5A00;border:.15cqw solid #E0B02F}
.tk{position:absolute;right:.2cqw;bottom:.2cqw;left:.2cqw;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.2cqw;z-index:3}
.pw{position:relative;width:3.3cqw;height:4.2cqw;margin-left:-.9cqw;transition:transform .15s;filter:drop-shadow(0 .15cqw .15cqw rgba(0,0,0,.35))}
.pw::before{content:'';position:absolute;left:-.1cqw;right:-.1cqw;bottom:-.1cqw;height:.9cqw;border-radius:50%;background:var(--c);opacity:.9}
.pw .cv{position:absolute;inset:0}.pw .cv svg{width:100%;height:100%;display:block}
.pw b{position:absolute;top:-.3cqw;right:-.5cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--c);color:#fff;border:.15cqw solid #fff;font:700 1cqw/1.2cqw Prompt,sans-serif;text-align:center}
.tk.many .pw{width:2.5cqw;height:3.2cqw;margin-left:-.8cqw}
.tk.many .pw b{width:1.2cqw;height:1.2cqw;font-size:.8cqw;line-height:1cqw}
.pw.cur{transform:scale(1.35) translateY(-.3cqw);z-index:5;animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.35) translateY(-.9cqw)}}
@media (prefers-reduced-motion:reduce){.pw.cur{animation:none}}
.ct{grid-column:2/9;grid-row:2/7;display:grid;grid-template-columns:1fr 1.55fr 1.2fr;gap:.8cqw;min-height:0}
.pn{background:#FFFCF5;border:.2cqw solid #E8D9B8;border-radius:1.2cqw;padding:.9cqw;display:flex;flex-direction:column;gap:.7cqw;min-width:0;min-height:0;overflow:hidden}
.pn .who{color:#fff;border-radius:1cqw;padding:.4cqw .8cqw;font:700 1.7cqw/1.3 Prompt,Sarabun,sans-serif;text-align:center;display:flex;align-items:center;justify-content:center;gap:.7cqw;flex-wrap:wrap}
.pn .who small{font:500 1.2cqw Sarabun,sans-serif;opacity:.95}
.av{width:3.2cqw;height:3.2cqw;border-radius:50%;background:#fff;overflow:hidden;display:block}.av svg,.sc .dt svg{width:100%;height:100%;display:block}
.die{align-self:center;width:8cqw;height:8cqw;background:#fff;border:.3cqw solid #1F2A44;border-radius:1.4cqw;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:.9cqw;gap:.2cqw}
.die i{border-radius:50%;background:#1F2A44;width:70%;height:70%;margin:auto}
.die i.o{background:transparent}
.bt{border:0;border-radius:1cqw;padding:.6cqw 1cqw;font:700 1.5cqw/1.3 Prompt,Sarabun,sans-serif;color:#fff;background:#1F2A44;cursor:pointer}
.bt:disabled{opacity:.35;cursor:default}
.bt.g{background:#1F9D68}.bt.o{background:#F28C1B}.bt.b{background:#2F6FDE}.bt.l{background:#fff;color:#1F2A44;border:.2cqw solid #1F2A44}
.sm{font-size:1.2cqw;color:#4A5578;text-align:center}
.pn h3{margin:0;font:700 1.5cqw/1.3 Prompt,Sarabun,sans-serif}
.pn .sit{font-size:1.75cqw;line-height:1.45;font-weight:500}
.pn .ms{font-size:1.4cqw;line-height:1.4;color:#1F2A44;background:#FFF1BF;border-radius:.8cqw;padding:.4cqw .8cqw}
.pn .row{display:flex;gap:.6cqw;flex-wrap:wrap;align-items:center}
.pn select{font:600 1.3cqw Sarabun,sans-serif;border:.15cqw solid #1F2A44;border-radius:.6cqw;padding:.2cqw}
.sc{display:flex;align-items:center;gap:.5cqw;font-size:1.35cqw;padding:.25cqw .3cqw;border-radius:.7cqw}
.sc.cur{background:#FFF1BF}
.sc .dt{flex:none;width:2.6cqw;height:2.6cqw;border-radius:50%;overflow:hidden;border:.2cqw solid}
.sc .nm{flex:1;white-space:nowrap;overflow:hidden}
.sc .cn2{font:700 1.6cqw Prompt,sans-serif;min-width:4.2cqw;text-align:right}
.sc button{border:.15cqw solid #1F2A44;background:#fff;border-radius:.6cqw;font:700 1.2cqw Prompt,sans-serif;cursor:pointer;padding:0 .5cqw}
#setup{max-width:720px;margin:40px auto;background:#FFFCF5;border:3px solid #E8D9B8;border-radius:20px;padding:28px;text-align:center}
#setup h2{margin:0 0 6px;font-size:28px}
#setup .nums{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
#setup .nums button{width:64px;height:64px;border-radius:16px;border:3px solid #1F2A44;background:#fff;font:700 26px Prompt,sans-serif;cursor:pointer}
#setup .nums button:hover{background:#FFF1BF}
#ov.solo .nb{display:none}

.home{max-width:1100px;margin:0 auto;padding:24px 16px 8px}
.hero{display:flex;align-items:center;gap:24px;background:#FFFCF5;border:3px solid #E8D9B8;border-radius:24px;padding:18px 28px}
.hero .kn{flex:none;width:130px;height:190px}.hero .kn svg{width:100%;height:100%;display:block}
.hero h2{margin:0 0 8px;font:700 clamp(30px,5vw,52px)/1.15 Prompt,sans-serif;color:#2F6FDE}
.hero p{margin:0;font-size:clamp(16px,2vw,22px);line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:22px}
.mt{border:0;border-radius:22px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s}
.mt:hover,.mt:focus-visible{transform:translateY(-5px);outline:3px solid #1F2A44;outline-offset:2px}
.mt .in{background:#FFFCF5;border-radius:16px;overflow:hidden}
.mt .ar{height:150px}.mt .ar svg{width:100%;height:100%;display:block}
.mt .tx{padding:12px 16px 16px}.mt h3{margin:0;font:700 26px Prompt,sans-serif}.mt p{margin:4px 0 0;font-size:17px;color:#4A5578}
.how{max-width:900px;margin:0 auto;padding:24px 16px 8px}
.how h2{font:700 32px Prompt,sans-serif;margin:0 0 14px}
.hs{display:flex;gap:16px;align-items:flex-start;background:#FFFCF5;border:3px solid #E8D9B8;border-radius:18px;padding:14px 18px;margin-bottom:12px;font-size:20px;line-height:1.55}
.hs i{flex:none;width:44px;height:44px;border-radius:50%;background:#2F6FDE;color:#fff;font:700 22px/44px Prompt,sans-serif;text-align:center;font-style:normal}
.hn{background:#FFF1BF;border:3px solid #E0B02F;border-radius:18px;padding:14px 18px;font-size:19px;line-height:1.6}

.ct{position:relative;display:block;border:.35cqw solid var(--tc,#E8D9B8);border-radius:1.4cqw;overflow:hidden;background:#FFF6E5}
.cbg{position:absolute;inset:0}.cbg .lay{position:absolute;inset:0;animation:fin .9s ease-out}.cbg svg{width:100%;height:100%;display:block}
@keyframes fin{from{opacity:0;transform:scale(1.06)}}
#cp{position:relative;display:grid;grid-template-columns:1fr 1.55fr 1.15fr;gap:.8cqw;padding:.8cqw;height:100%}
.pn{background:rgba(255,252,245,.94)}
.pn.lf{background:none;border:0;padding:0;overflow:visible;gap:.6cqw}
.pn.lf .who{justify-content:space-between;text-align:left;padding:.5cqw .9cqw;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.25)}
.pn.lf .who>span:first-child{display:flex;flex-direction:column;line-height:1.2}
.cbd{display:flex;align-items:center;gap:.4cqw;background:#fff;color:#1F2A44;border-radius:1cqw;padding:.2cqw .8cqw;font:700 1.6cqw Prompt,sans-serif}
.cbd .coin{width:2cqw;height:2cqw}
.dr{display:flex;align-items:center;gap:.8cqw;background:rgba(255,252,245,.94);border-radius:1.2cqw;padding:.6cqw .9cqw;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.2)}
.dr .die{width:5.4cqw;height:5.4cqw;padding:.7cqw;border-radius:1.1cqw;flex:none}
.dc{display:flex;flex-direction:column;gap:.3cqw;flex:1;min-width:0}.dc .bt{font-size:1.4cqw;padding:.5cqw .6cqw}
.stg{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bub{position:relative;background:#fff;border:.25cqw solid;border-radius:1.2cqw;padding:.5cqw 1cqw;font:600 1.4cqw/1.35 Sarabun,sans-serif;text-align:center;margin-bottom:1cqw;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.2)}
.bub::after{content:'';position:absolute;left:50%;bottom:-.9cqw;width:1.2cqw;height:1.2cqw;background:#fff;border-right:.25cqw solid;border-bottom:.25cqw solid;border-color:inherit;transform:translateX(-50%) rotate(45deg)}
.chw{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-end;padding-bottom:1cqw}
.chr{position:relative;z-index:2;height:100%;max-height:25cqw;aspect-ratio:170/245;filter:drop-shadow(0 .3cqw .3cqw rgba(0,0,0,.3))}
.chr svg{width:100%;height:100%;display:block}
.gnd{position:absolute;bottom:.3cqw;width:70%;height:2.2cqw;border-radius:50%;background:var(--tc);opacity:.55;z-index:1}
.chr.idle{animation:bobi 2.4s ease-in-out infinite}.chr.hop{animation:hop .3s ease-in-out infinite}.chr.shake{animation:shk .25s linear infinite}
@keyframes bobi{50%{transform:translateY(-.6cqw)}}@keyframes hop{50%{transform:translateY(-2.2cqw) rotate(-3deg)}}@keyframes shk{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.chr.idle,.chr.hop,.chr.shake,.cbg .lay,.c2.land{animation:none}}
.pn.mid{background:none;border:0;padding:0;overflow:visible;justify-content:space-between}
.loc{align-self:flex-start;display:flex;align-items:center;gap:.7cqw;color:#fff;border-radius:2cqw;padding:.4cqw 1.2cqw .4cqw .5cqw;font:700 1.8cqw Prompt,sans-serif;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.3)}
.loc b{width:2.6cqw;height:2.6cqw;border-radius:50%;background:#fff;color:#1F2A44;display:flex;align-items:center;justify-content:center;font-size:1.5cqw}
.loc small{font:500 1.2cqw Sarabun,sans-serif;opacity:.95}
.c2{background:rgba(255,252,245,.95);border:.3cqw solid;border-radius:1.3cqw;padding:1cqw 1.1cqw;display:flex;flex-direction:column;gap:.7cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25)}
.c2.land{animation:pop .45s ease-out}@keyframes pop{from{transform:translateY(2cqw) scale(.94);opacity:.2}}
.c2 .sit{font-size:1.8cqw;line-height:1.45;font-weight:500}
.gb{border-radius:1cqw;padding:.3cqw 1cqw;font:700 1.4cqw Prompt,sans-serif;align-self:flex-start}
.gb.p{background:#E1F5E9;color:#1F7A4D;border:.15cqw solid #1F9D68}.gb.m{background:#FDE6E6;color:#C23B3B;border:.15cqw solid #C23B3B}.gb.c{background:#FFF1BF;color:#7A5A00;border:.15cqw solid #E0B02F}
.bign{font:700 5cqw/1.2 Prompt,sans-serif;text-align:center;color:#1F2A44}
.bt.big{font-size:1.9cqw;padding:.8cqw 1.8cqw}
.pn.rt{display:flex;flex-direction:column}
</style>
</head>
<body>
<header>
<h1>ตลาดนัดอัตราส่วน</h1>
<div class="tabs"><button class="tab" data-v="home">หน้าหลัก</button><button class="tab" data-v="cards" id="tc">การ์ด</button><button class="tab" data-v="board" id="tb">กระดานเกม</button><button class="tab" data-v="howto">วิธีเล่น</button></div>
<nav id="nav"></nav>

const {cards,scenes,decks,order}=DATA;
const coin='<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#F4B400"/><circle cx="10" cy="10" r="6.48" fill="#FFC933" stroke="#D99A00" stroke-width="1"/><text x="10" y="13.42" font-size="9.9" font-weight="700" font-family="Prompt,Sarabun,sans-serif" text-anchor="middle" fill="#9A6A00">฿</text></svg>';
const seenKey='ratioCardsSeen';let seen={};
try{seen=JSON.parse(localStorage.getItem(seenKey)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(seenKey,JSON.stringify(seen))}catch(e){}};
const id=c=>c.deck+c.no;
const list=order.flatMap(k=>cards.filter(c=>c.deck===k));
const $=s=>document.querySelector(s);
const main=$('#main'),nav=$('#nav');
order.forEach(k=>{
  const d=decks[k],cs=cards.filter(c=>c.deck===k);
  nav.insertAdjacentHTML('beforeend',`<a href="#d${k}" style="background:${d.color}">${d.short}</a>`);
  const sec=document.createElement('section');sec.id='d'+k;
  sec.innerHTML=`<h2 style="color:${d.color}">${d.name}<small>${cs.length} ใบ</small></h2><div class="grid"></div>`;
  const g=sec.querySelector('.grid');
  cs.forEach(c=>{
    const b=document.createElement('button');b.className='tile';b.style.background=d.color;b.dataset.id=id(c);
    const tag=c.deck==='E'?c.chip:'+'+c.coins+' เหรียญ';
    b.innerHTML=`<div class="in"><div class="art">${scenes[c.scene]}</div><div class="meta"><div class="no" style="color:${d.color}">${c.no}</div><div class="ti">${c.title}</div><div class="co">${tag}</div></div></div><span class="seen">&#10003;</span>`;
    b.onclick=()=>{$('#ov').classList.remove('solo');open(list.indexOf(c))};
    g.appendChild(b);
  });
  main.appendChild(sec);
});
function mark(){document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('done',!!seen[t.dataset.id]))}
mark();
$('#reset').onclick=()=>{seen={};save();mark()};
function front(c){
  const d=decks[c.deck],right=c.deck==='E'?`<div class="pill" style="background:${d.color}">${c.chip}</div>`:`<div class="cn">${coin}<span>+${c.coins}</span></div>`;
  return `<div class="card" style="background:${d.color}"><div class="pp"><div class="top"><div class="l"><div class="pill" style="background:${d.color}">${d.name}</div><div class="num">${c.no}/${c.total}</div></div>${right}</div><div class="art2" style="height:44.6cqw;border-color:${d.color}">${scenes[c.scene]}</div><div class="ttl" style="color:${d.color}">${c.title}</div><div class="txt">${c.text}</div><div class="sp"></div><div class="foot" style="border-color:${d.color}66">คิดวิธีทำก่อน แล้วแตะการ์ดเพื่อดูเฉลย</div></div></div>`;
}
function back(c){
  const d=decks[c.deck],E=c.deck==='E';
  const steps=c.steps.map((s,i)=>`<div class="st"><i style="background:${d.color}">${i+1}</i><span>${s}</span></div>`).join('');
  const foot=E?`<div class="gain" style="background:${d.color};color:#fff">${coin}<span>เหรียญเปลี่ยน ${c.effect}</span></div>`:`<div class="gain" style="background:#FFF1BF;border:.6cqw solid #E0B02F">${coin}<span>ตอบถูก รับ +${c.coins} เหรียญ</span></div>`;
  return `<div class="card" style="background:${d.color}"><div class="pp"><div class="top"><div class="l"><div class="pill ink">เฉลย</div><div class="num" style="color:${d.color};font-weight:700">${d.short} ${c.no}/${c.total}</div></div></div><div class="art2" style="height:16cqw;border-color:${d.color}">${scenes[c.scene]}</div><div class="abox" style="background:${d.light};border-color:${d.color}"><div class="alabel" style="color:${d.color}">${E?'ผลที่ได้':'คำตอบ'}</div><div class="aval">${c.ans}</div></div><div><div class="sh">วิธีคิด</div>${steps}</div><div class="sp"></div>${foot}</div></div>`;
}
let cur=-1;
const TM=120;let tleft=TM,tend=0,tiv=null,actx=null;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tshow(){$('#tt').textContent=fmt(tleft);const m=$('#tm');m.classList.toggle('run',!!tiv&&tleft>10);m.classList.toggle('warn',!!tiv&&tleft<=10&&tleft>0);m.classList.toggle('end',tleft===0)}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const s=actx.currentTime+d;g.gain.setValueAtTime(.25,s);g.gain.exponentialRampToValueAtTime(.001,s+.3);o.start(s);o.stop(s+.3)})}catch(e){}}
function tstop(){if(tiv){clearInterval(tiv);tiv=null}}
function treset(){tstop();tleft=TM;$('#ts').textContent='เริ่มจับเวลา';tshow()}
function ttick(){tleft=Math.max(0,Math.ceil((tend-Date.now())/1000));if(tleft===0){tstop();$('#ts').textContent='เริ่มใหม่';beep()}tshow()}
$('#ts').onclick=e=>{e.stopPropagation();
  if(tiv){tstop();$('#ts').textContent='ต่อเวลา';tshow();return}
  if(tleft===0)tleft=TM;
  tend=Date.now()+tleft*1000;tiv=setInterval(ttick,200);$('#ts').textContent='หยุดชั่วคราว';tshow()};
$('#tr').onclick=e=>{e.stopPropagation();treset()};

function show(i){
  cur=i;treset();const c=list[i];
  $('#ff').innerHTML=front(c);$('#fb').innerHTML=back(c);
  $('#fl').classList.remove('back','turn');delete $('#fl').dataset.busy;
  $('#pv').disabled=i===0;$('#nx').disabled=i===list.length-1;
}
function open(i){show(i);$('#ov').classList.add('on');document.body.style.overflow='hidden'}
function close(){treset();$('#ov').classList.remove('on');document.body.style.overflow='';mark();if(G&&location.hash==='#board')render()}
function flip(){
  const f=$('#fl');if(f.dataset.busy)return;f.dataset.busy='1';f.classList.add('turn');
  setTimeout(()=>{f.classList.toggle('back');f.classList.remove('turn');
    if(f.classList.contains('back')){seen[id(list[cur])]=1;save()}
    setTimeout(()=>{delete f.dataset.busy},230)},230);
}
$('#fl').onclick=e=>{e.stopPropagation();flip()};
$('#pv').onclick=e=>{e.stopPropagation();if(cur>0)show(cur-1)};
$('#nx').onclick=e=>{e.stopPropagation();if(cur<list.length-1)show(cur+1)};
$('#x').onclick=close;
$('#ov').onclick=e=>{if(e.target.id==='ov'||e.target.classList.contains('stage'))close()};
document.addEventListener('keydown',e=>{
  if(!$('#ov').classList.contains('on'))return;
  if(e.key==='Escape')close();
  else if(e.key==='ArrowRight'&&cur<list.length-1)show(cur+1);
  else if(e.key==='ArrowLeft'&&cur>0)show(cur-1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}
});

const BD=DATA.cells,TK=DATA.tokens,TC=['#F28C1B','#2F6FDE','#1F9D68','#7048C8','#D4537E','#16A5A0','#B8860B','#E5484D'],CN=['น้องส้ม','น้องพาย','น้องเลข','น้องขนม','น้องมะลิ','น้องกล้า','น้องฟ้า','ครูน็อต'];
const head=i=>TK[i].replace(/viewBox="[^"]*"/,'viewBox="45 12 110 110"');
const DN={R:'อัตราส่วน',P:'ร้อยละ',E:'เหตุการณ์',M:'ท้าทายผสม',S:'เริ่มต้น'};
const DC={S:'#1F9D68'};order.forEach(k=>DC[k]=decks[k].color);
const GK='ratioBoardGame';let G=null;
try{G=JSON.parse(localStorage.getItem(GK)||'null')}catch(e){}
const saveG=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}};
const bd=$('#bd');
BD.forEach(c=>{
  const n=c.n;let col,row;
  if(n<=9){col=n;row=7}else if(n<=14){col=9;row=7-(n-9)}else if(n<=23){col=9-(n-15);row=1}else{col=1;row=n-22}
  const k=c.deck,cl=document.createElement('div');cl.className='cl';cl.id='c'+n;
  cl.style.cssText=`grid-column:${col};grid-row:${row};border-color:${DC[k]}`;
  const gm=c.gim==='+'?'<span class="gm p">ดาวฟรี +1</span>':c.gim==='-'?'<span class="gm m">เสียดาว −1</span>':c.gim==='coin'?'<span class="gm c">+20 เหรียญ</span>':'';
  cl.innerHTML=`<div class="bn" style="background:${DC[k]}"><b style="color:${DC[k]}">${n}</b><span>${DN[k]}</span></div><div class="ar">${c.scene?scenes[c.scene]:''}${gm}<div class="tk"></div></div>`;
  bd.appendChild(cl);
});
const ct=document.createElement('div');ct.className='ct';ct.id='ct';ct.innerHTML='<div class="cbg" id="cbg"></div><div id="cp"></div>';bd.appendChild(ct);
let bgKey='';
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const pips=n=>Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i+1)?'':'o'}"></i>`).join('');
function newGame(n){
  G={teams:Array.from({length:n},(_,i)=>({name:'กลุ่ม '+(i+1),coins:100,pos:1,turns:0})),cur:0,phase:'roll',queue:{},msgs:[],last:null,die:1};
  saveG();render();
}
function setup(){
  $('#setup').innerHTML=`<h2>เริ่มเล่นบนกระดาน</h2><div>เลือกจำนวนกลุ่มที่เล่น (ทุกกลุ่มเริ่มช่อง 1 ถือ 100 เหรียญ)</div><div class="nums">${[2,3,4,5,6,7,8].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;
}
$('#setup').onclick=e=>{const b=e.target.closest('button');if(b)newGame(+b.dataset.n)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function drawIdx(k){
  if(!G.queue[k]||!G.queue[k].length)G.queue[k]=shuffle(list.map((c,i)=>c.deck===k?i:-1).filter(i=>i>=0));
  return G.queue[k].pop();
}
const addC=(t,d)=>{const b=t.coins;t.coins=Math.max(0,t.coins+d);return t.coins-b};
function roll(){
  if(!G||G.phase!=='roll')return;
  G.phase='rolling';render();
  const iv=setInterval(()=>{const d=$('#die');if(d)d.innerHTML=pips(1+Math.floor(Math.random()*6))},80);
  setTimeout(()=>{clearInterval(iv);G.die=1+Math.floor(Math.random()*6);G.phase='moving';G.msgs=[];render();walk(G.die)},800);
}
function walk(k){
  const t=G.teams[G.cur];
  if(k===0){land();return}
  t.pos=t.pos%28+1;
  if(t.pos===1){addC(t,20);G.msgs.push('ผ่านช่อง 1 รับ +20 เหรียญ')}
  render();
  setTimeout(()=>walk(k-1),300);
}
function land(){
  const t=G.teams[G.cur],c=BD[t.pos-1];
  if(c.gim==='+'){addC(t,10);G.msgs.push('ดาวฟรี! รับ +10 เหรียญ')}
  else if(c.gim==='-'){const d=addC(t,-10);G.msgs.push(d?'เสียดาว −10 เหรียญ':'เสียดาว แต่ไม่มีเหรียญให้จ่าย')}
  G.phase='cell';G.pop=true;saveG();render();
}
function openCard(idx){$('#ov').classList.add('solo');open(idx)}
function act(a,el){
  const t=G.teams[G.cur];
  if(a==='roll')roll();
  else if(a==='draw'){const c=BD[t.pos-1];G.last={idx:drawIdx(c.deck),done:false};saveG();render();openCard(G.last.idx)}
  else if(a==='view')openCard(G.last.idx);
  else if(a==='ok'){const c=list[G.last.idx];addC(t,c.coins);G.msgs.push(`ตอบถูก +${c.coins} เหรียญ`);G.last.done=true}
  else if(a==='steal'){const i=+$('#stl').value,c=list[G.last.idx],h=Math.floor(c.coins/2);addC(G.teams[i],h);G.msgs.push(`${G.teams[i].name} ชิงได้ +${h} เหรียญ`);G.last.done=true}
  else if(a==='eff'){const c=list[G.last.idx],v=parseInt(String(c.effect).replace('−','-'),10);const d=addC(t,v);G.msgs.push(`ผลการ์ด ${d>0?'+':''}${d} เหรียญ`);G.last.done=true}
  else if(a==='adj'){addC(G.teams[+el.dataset.i],+el.dataset.d)}
  else if(a==='end'){t.turns++;G.cur=(G.cur+1)%G.teams.length;G.phase='roll';G.msgs=[];G.last=null}
  else if(a==='reset'){if(confirm('เริ่มเกมใหม่? คะแนนปัจจุบันจะหายไป')){G=null;try{localStorage.removeItem(GK)}catch(e){}}}
  if(a!=='roll'&&a!=='draw'&&a!=='view'){saveG()}
  if(a!=='roll'&&a!=='view')render();
}
ct.onclick=e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b)};
document.addEventListener('keydown',e=>{
  if(e.key===' '&&G&&!$('#bv').hidden&&!$('#ov').classList.contains('on')&&G.phase==='roll'){e.preventDefault();roll()}
});
function render(){
  if(!G){$('#bd').hidden=true;$('#setup').hidden=false;setup();return}
  $('#setup').hidden=true;$('#bd').hidden=false;
  const t=G.teams[G.cur],col=TC[G.cur],cell=BD[t.pos-1],n=G.teams.length,k=cell.deck;
  const round=Math.min(...G.teams.map(x=>x.turns))+1;
  const nextT=G.teams[(G.cur+1)%n];
  const card=G.last?list[G.last.idx]:null;
  const pop=G.pop;G.pop=false;
  ct.style.setProperty('--tc',col);
  if(G.phase==='cell'||G.phase==='roll'){
    const key=t.pos+':'+G.cur;
    if(key!==bgKey){bgKey=key;$('#cbg').innerHTML=`<div class="lay">${cell.scene?scenes[cell.scene]:''}</div>`}
  }
  let say,anim='idle';
  if(G.phase==='roll')say='ถึงตาเราแล้ว! ทอยลูกเต๋าเลย';
  else if(G.phase==='rolling'){say='ลุ้นนนน…';anim='shake'}
  else if(G.phase==='moving'){say='ไปกันเลย!';anim='hop'}
  else if(!card)say=cell.gim==='+'?'เย้! ได้ดาวฟรี':cell.gim==='-'?'โอ๊ะ เสียดาวซะแล้ว':k==='S'?'ผ่านจุดเริ่มต้น รับเหรียญ!':'ช่องนี้ต้องจั่วการ์ด';
  else say=G.last.done?'เก็บคะแนนแล้ว จบตาได้':'ช่วยกันคิดนะ';
  const hint=G.phase==='roll'?'กดปุ่มหรือกด Space':G.phase==='cell'?'ถึงช่อง '+t.pos+' แล้ว':G.phase==='moving'?'กำลังเดิน…':'กำลังทอย…';
  const left=`<div class="pn lf"><div class="who" style="background:${col}"><span>ตาของ ${t.name}<small>${CN[G.cur]} · รอบที่ ${round}</small></span><span class="cbd">${coin}${t.coins}</span></div><div class="dr"><div class="die" id="die">${pips(G.die||1)}</div><div class="dc"><button class="bt g" data-act="roll" ${G.phase==='roll'?'':'disabled'}>ทอยลูกเต๋า</button><div class="sm">${hint}</div></div></div><div class="stg"><div class="bub" style="border-color:${col}">${say}</div><div class="chw"><div class="chr ${anim}">${TK[G.cur]}</div><div class="gnd"></div></div></div></div>`;
  let loc=`<div class="loc" style="background:${DC[k]}"><b>${t.pos}</b>${G.phase==='moving'?'กำลังเดิน…':cell.title}<small>${DN[k]}</small></div>`;
  let h='';
  if(G.phase==='cell'){
    const gb=cell.gim==='+'?'<div class="gb p">ดาวฟรี +1 ดาว (+10 เหรียญ)</div>':cell.gim==='-'?'<div class="gb m">เสียดาว −1 ดาว (−10 เหรียญ)</div>':cell.gim==='coin'?'<div class="gb c">ผ่านหรือหยุดช่องนี้ รับ +20 เหรียญ</div>':'';
    h=`<div class="sit">${cell.sit}</div>${gb}`;
    if(G.msgs.length)h+=`<div class="ms">${G.msgs.join('<br>')}</div>`;
    h+='<div class="row">';
    if(k!=='S'&&!card)h+=`<button class="bt big" style="background:${DC[k]}" data-act="draw">จั่วการ์ด${DN[k]}</button>`;
    if(card){
      h+=`<button class="bt l" data-act="view">ดูการ์ด: ${card.title}</button>`;
      if(!G.last.done){
        if(card.deck==='E'&&!isNaN(parseInt(String(card.effect).replace('−','-'),10)))h+=`<button class="bt o" data-act="eff">ใช้ผลการ์ด ${card.effect}</button>`;
        else if(card.deck!=='E'){
          h+=`<button class="bt g" data-act="ok">ตอบถูก +${card.coins}</button>`;
          h+=`<select id="stl">${G.teams.map((x,i)=>i===G.cur?'':`<option value="${i}">${x.name}</option>`).join('')}</select><button class="bt b" data-act="steal">ชิงได้ +${Math.floor(card.coins/2)}</button>`;
        }
      }
    }
    h+=`</div><div class="row"><button class="bt" data-act="end">จบตา → ${nextT.name}</button></div>`;
  }else if(G.phase==='roll'){
    h=`<div class="sit">ตัวแทน${t.name}ออกมาทอยลูกเต๋า แล้วเดินตามแต้ม</div>${G.msgs.length?`<div class="ms">${G.msgs.join('<br>')}</div>`:''}`;
  }else{
    h=`<div class="bign">เดิน ${G.die||''} ช่อง</div>${G.msgs.length?`<div class="ms">${G.msgs.join('<br>')}</div>`:''}`;
  }
  const mid=`<div class="pn mid">${loc}<div class="c2 ${pop?'land':''}" style="border-color:${DC[k]}">${h}</div></div>`;
  const mx=Math.max(...G.teams.map(x=>x.coins));
  const right=`<div class="pn rt"><h3>คะแนนเหรียญ</h3>${G.teams.map((x,i)=>`<div class="sc ${i===G.cur?'cur':''}"><span class="dt" style="background:${TC[i]}">${head(i)}</span><span class="nm">${x.name}${x.coins===mx&&mx>100?' ★':''}</span><button data-act="adj" data-i="${i}" data-d="-10">−</button><span class="cn2">${x.coins}</span><button data-act="adj" data-i="${i}" data-d="10">+</button></div>`).join('')}<div class="row" style="margin-top:auto"><button class="bt l" style="font-size:1.1cqw" data-act="reset">เริ่มเกมใหม่</button></div></div>`;
  $('#cp').innerHTML=left+mid+right;
  document.querySelectorAll('.cl').forEach(c=>{c.classList.toggle('here',c.id==='c'+t.pos);c.querySelector('.tk').innerHTML=''});
  const cnt={};G.teams.forEach(x=>cnt[x.pos]=(cnt[x.pos]||0)+1);
  G.teams.forEach((x,i)=>{document.querySelector('#c'+x.pos+' .tk').insertAdjacentHTML('beforeend',`<span class="pw ${i===G.cur?'cur':''}" style="--c:${TC[i]}"><span class="cv">${TK[i]}</span><b>${i+1}</b></span>`)});
  Object.keys(cnt).forEach(k2=>document.querySelector('#c'+k2+' .tk').classList.toggle('many',cnt[k2]>3));
}

$('#kn').innerHTML=TK[7];
[['cards','คลังการ์ด','การ์ด 64 ใบ แยกตามหมวด กดดูโจทย์และเฉลย','#2F6FDE','orchard'],['board','กระดานเกม','ทอยลูกเต๋า เดินตัวการ์ตูน จั่วการ์ด นับเหรียญ','#1F9D68','gate'],['howto','วิธีเล่น','กติกา 7 ขั้นตอนสำหรับเล่นทั้งห้อง','#F28C1B','books']].forEach(([v,h,d,c,sc])=>{
  const b=document.createElement('button');b.className='mt';b.style.background=c;b.dataset.v=v;
  b.innerHTML=`<div class="in"><div class="ar">${scenes[sc]}</div><div class="tx"><h3 style="color:${c}">${h}</h3><p>${d}</p></div></div>`;$('#menu').appendChild(b)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)location.hash=b.dataset.v});
function route(){
  const h=location.hash.slice(1),v=['cards','board','howto'].includes(h)?h:(/^d[RPEM]$/.test(h)?'cards':'home');
  $('#hv').hidden=v!=='home';$('#wv').hidden=v!=='howto';$('#main').hidden=v!=='cards';$('#bv').hidden=v!=='board';
  nav.hidden=v!=='cards';$('#reset').hidden=v!=='cards';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='board')render();
}
window.addEventListener('hashchange',route);
route();
</script>
